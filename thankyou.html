<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Message Sent | Salma Mulla</title>


    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background: #050505;

            color: white;

            font-family: "Inter", sans-serif;

        }


        .box {

            max-width: 650px;

            width: 100%;

            padding: 60px 40px;

            text-align: center;

            background: #101010;

            border: 1px solid rgba(255,1,79,0.25);

            border-radius: 20px;

            box-shadow:
                0 20px 70px rgba(0,0,0,0.4);

        }


        .icon {

            width: 85px;

            height: 85px;

            margin: 0 auto 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: rgba(255,1,79,0.08);

            border: 1px solid #FF014F;

            color: #FF014F;

            font-size: 32px;

        }


        h1 {

            font-size: 38px;

            margin-bottom: 18px;

        }


        h1 span {
            color: #FF014F;
        }


        p {

            color: #999;

            line-height: 1.8;

            margin-bottom: 30px;

        }


        a {

            display: inline-block;

            padding: 14px 25px;

            background: #FF014F;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-weight: 700;

            transition: 0.3s;

        }


        a:hover {

            background: #d90042;

            transform: translateY(-3px);

        }


        @media(max-width:600px) {

            .box {
                padding: 45px 25px;
            }

            h1 {
                font-size: 29px;
            }

        }

    </style>

</head>


<body>

    <div class="box">

        <div class="icon">
            ✓
        </div>


        <h1>
            Message <span>Sent!</span>
        </h1>


        <p>

            Thank you for reaching out.

            Your message has been successfully submitted.

            I'll get back to you as soon as possible.

        </p>


        <a href="index.html">
            Back to Portfolio
        </a>

    </div>

</body>

</html>
